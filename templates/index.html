<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atlas</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <div class="container">

        <h1>Atlas</h1>
        <p>Your Personal File Search Engine</p>

        <!-- Search Form -->
        <form action="/search" method="get">

            <input
                type="text"
                name="query"
                placeholder="Search for a file..."
                value="{{ query }}"
            >

            <button type="submit">
                Search
            </button>

        </form>

        <br>

        <!-- Scan Button -->
        <form action="/scan" method="get">

    <input
        type="text"
        name="folder"
        placeholder="Enter folder path (e.g. D:\Downloads)"
        required
    >

    <button type="submit">
        Scan Folder
    </button>

</form>

        <hr>

        <h2>Search Results</h2>

        {% if results %}

            <ul>

            {% for file in results %}

                <li>
                    <strong>{{ file[0] }}</strong><br>
                    {{ file[1] }}<br>
                    Last Modified: {{ file[2] }}
                </li>

                <br>

            {% endfor %}

            </ul>

        {% elif query %}

            <p>No files found.</p>

        {% endif %}

    </div>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>

</html>
